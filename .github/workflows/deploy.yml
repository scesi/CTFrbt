name: Build and Deploy

on:
  push:
    branches:
      - main
      - dev

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      primary_tag: ${{ steps.tags.outputs.PRIMARY_TAG }}

    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Generar Tags
        id: tags
        run: |
          SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)

          # MAIN
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "DOCKER_TAGS=${{ secrets.DOCKERHUB_USERNAME }}/ctfrbt-app:latest,${{ secrets.DOCKERHUB_USERNAME }}/ctfrbt-app:${SHORT_SHA}" >> $GITHUB_ENV
            echo "PRIMARY_TAG=latest" >> $GITHUB_OUTPUT
            
          # DEV
          elif [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            echo "DOCKER_TAGS=${{ secrets.DOCKERHUB_USERNAME }}/ctfrbt-app:dev,${{ secrets.DOCKERHUB_USERNAME }}/ctfrbt-app:${SHORT_SHA}" >> $GITHUB_ENV
            echo "PRIMARY_TAG=dev" >> $GITHUB_OUTPUT
          fi

      - name: Iniciar sesion en Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Construir y Subir Imagen
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ env.DOCKER_TAGS }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/ctfrbt-app:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/ctfrbt-app:buildcache,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar Variables de Entorno según la Rama
        id: env-vars
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "STACK_NAME=ctfrbt_org" >> $GITHUB_ENV
            echo "APP_PORT=3002" >> $GITHUB_ENV
            echo "TARGET_DIR=/opt/stacks/ctfrbt-org/" >> $GITHUB_ENV
            echo "DB_USER=ctfrbt_org" >> $GITHUB_ENV
            echo "DB_PASS=${{ secrets.ORG_DB_PASSWORD }}" >> $GITHUB_ENV
            echo "DB_NAME=ctfrbt_org" >> $GITHUB_ENV
            echo "NEXTAUTH_URL=https://ctf.scesi.org" >> $GITHUB_ENV
            echo "NEXTAUTH_SECRET=${{ secrets.ORG_NEXTAUTH_SECRET }}" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            echo "STACK_NAME=ctfrbt_dev" >> $GITHUB_ENV
            echo "APP_PORT=3001" >> $GITHUB_ENV
            echo "TARGET_DIR=/opt/stacks/ctfrbt-dev/" >> $GITHUB_ENV
            echo "DB_USER=ctfrbt_dev" >> $GITHUB_ENV
            echo "DB_PASS=${{ secrets.DEV_DB_PASSWORD }}" >> $GITHUB_ENV
            echo "DB_NAME=ctfrbt_dev" >> $GITHUB_ENV
            echo "NEXTAUTH_URL=https://ctf.scesi.dev" >> $GITHUB_ENV
            echo "NEXTAUTH_SECRET=${{ secrets.DEV_NEXTAUTH_SECRET }}" >> $GITHUB_ENV
          fi

      - name: Codificar password para la URL
        run: |
          ENCODED="$(python3 -c "import urllib.parse,os;print(urllib.parse.quote(os.environ['DB_PASS'],safe=''))")"
          echo "DB_PASS_ENC=$ENCODED" >> "$GITHUB_ENV"

      - name: Validar URL de conexión
        env:
          DB_URL: ${{ format('postgresql://{0}:{1}@postgres:5432/{2}', env.DB_USER, env.DB_PASS_ENC, env.DB_NAME) }}
        run: |
          python3 -c "import os,urllib.parse;p=urllib.parse.urlparse(os.environ['DB_URL']);assert p.username and p.password;print('OK',p.hostname)"
          echo "DATABASE_URL_READY=${DB_URL}" >> "$GITHUB_ENV"

      - name: Copiar Compose File al Servidor
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "compose.swarm.yml"
          target: ${{ env.TARGET_DIR }}
          overwrite: true

      - name: Ejecutar Despliegue en Docker Swarm
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e
            cd ${{ env.TARGET_DIR }}

            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/ctfrbt-app:${{ needs.build-and-push.outputs.primary_tag }}

            export DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"
            export IMAGE_TAG="${{ needs.build-and-push.outputs.primary_tag }}"
            export APP_PORT=${{ env.APP_PORT }}
            export POSTGRES_USER="${{ env.DB_USER }}"
            export POSTGRES_PASSWORD="${{ env.DB_PASS }}"
            export POSTGRES_DB="${{ env.DB_NAME }}"
            export DATABASE_URL="${{ env.DATABASE_URL_READY }}"
            export NEXTAUTH_URL="${{ env.NEXTAUTH_URL }}"
            export NEXTAUTH_SECRET="${{ env.NEXTAUTH_SECRET }}"

            docker stack deploy -c compose.swarm.yml ${{ env.STACK_NAME }} --with-registry-auth

            docker image prune -af
