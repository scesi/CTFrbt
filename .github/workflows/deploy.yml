name: Build and Deploy

on:
  push:
    branches:
      - main
      - dev

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      primary_tag: ${{ steps.tags.outputs.PRIMARY_TAG }}

    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Generar Tags
        id: tags
        run: |
          SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)

          # MAIN
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "DOCKER_TAGS=${{ secrets.DOCKERHUB_USERNAME }}/ctfrbt-app:latest,${{ secrets.DOCKERHUB_USERNAME }}/ctfrbt-app:${SHORT_SHA}" >> $GITHUB_ENV
            echo "PRIMARY_TAG=latest" >> $GITHUB_OUTPUT

          # DEV
          elif [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            echo "DOCKER_TAGS=${{ secrets.DOCKERHUB_USERNAME }}/ctfrbt-app:dev,${{ secrets.DOCKERHUB_USERNAME }}/ctfrbt-app:${SHORT_SHA}" >> $GITHUB_ENV
            echo "PRIMARY_TAG=dev" >> $GITHUB_OUTPUT
          fi

      - name: Iniciar sesion en Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Construir y Subir Imagen
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ env.DOCKER_TAGS }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/ctfrbt-app:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/ctfrbt-app:buildcache,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Determinar Entorno y Tag
        id: env-vars
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "OVERLAY=prod" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            echo "OVERLAY=dev" >> $GITHUB_ENV
          fi

          echo "SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_ENV

      - name: Configurar credenciales de GitLab
        run: |
          echo "machine lab.sasxr.com login oauth2 password ${{ secrets.GITLAB_TOKEN }}" > ~/.netrc
          chmod 600 ~/.netrc

      - name: Clonar Repo de Manifiestos (GitLab)
        run: |
          git clone https://lab.sasxr.com/s-system/deploy.git

      - name: Instalar Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Actualizar manifiestos con Kustomize
        run: |
          cd deploy/k/scesi-ctfrbt/overlays/${{ env.OVERLAY }}

          kustomize edit set image ${{ secrets.DOCKERHUB_USERNAME }}/ctfrbt-app=${{ secrets.DOCKERHUB_USERNAME }}/ctfrbt-app:${{ env.SHORT_SHA }}

      - name: Hacer Commit y Push a GitLab
        run: |
          cd deploy
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add k/scesi-ctfrbt/overlays/${{ env.OVERLAY }}/kustomization.yaml

          git commit -m "chore(ctfrbt): update ${{ env.OVERLAY }} image to tag ${{ env.SHORT_SHA }}" || true

          git push origin main
