update_dev_deploy_repo:
  stage: update_manifests
  image: alpine:latest
  variables:
    IMAGE_TAG: "$CI_REGISTRY_IMAGE/dev:$CI_COMMIT_SHORT_SHA"
  script:
    - apk add --no-cache git curl tar
    - git config --global http.sslVerify false
    - git clone https://oauth2:${DEPLOY_TOKEN}@lab.sasxr.com/s-system/deploy.git
    - cd deploy/k8s/apps/scesi-ctfrbt/overlays/dev
    - curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v5.3.0/kustomize_v5.3.0_linux_amd64.tar.gz" | tar xz
    - ./kustomize edit set image ctfrbt-app-image=$IMAGE_TAG
    - git config --global user.email "gitlab-ci@sasxr.com"
    - git config --global user.name "GitLab CI Pipeline"
    - git add kustomization.yaml
    - git commit -m "Update CTFRBT DEV image to $CI_COMMIT_SHORT_SHA"
    - git push origin main
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"

